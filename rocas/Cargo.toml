[package]
name = "rocas"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lints]
workspace = true

[features]
default = ["self-update"]
# Update checks and in-place updates from GitHub releases. Package-manager
# builds (the nix package) turn this off: it is most of the binary.
self-update = ["dep:self_update"]

[build-dependencies]
winres = "0.1"

[dependencies]
log.workspace = true
auto-launch = "0.6.0"
dirs = "6.0.0"
thiserror = "2.0.18"
self_update = { version = "0.44.0", optional = true, default-features = false, features = [
    "reqwest",
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
] }
forgeconf = { git = "https://github.com/chikof/forgeconf.git", rev = "f18d4caf9b0a22d078e1f436f1f264fd633fb9f5", features = ["watch"] }
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

