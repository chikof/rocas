[package]
name = "rocas"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lints]
workspace = true

[features]
default = ["self-update"]
# Update checks and in-place updates from GitHub releases. Package-manager
# builds (the nix package) turn this off: it is most of the binary.
self-update = ["dep:self_update"]

[build-dependencies]
winres = "0.1"

[dependencies]
log.workspace = true
auto-launch = "0.6.0"
dirs = "7.0.0"
thiserror = "2.0.18"
self_update = { version = "1.3.3", optional = true, default-features = false, features = [
    "github",
    "reqwest",
    "rustls",
    "compression-tar-gz",
    "compression-zip-deflate",
] }
forgeconf = "1.0.0"
notify = "8.2.0"
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

