[package]
name = "rocas"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lints]
workspace = true

[build-dependencies]
winres = "0.1"

[dependencies]
log.workspace = true
auto-launch = "0.6.0"
dirs = "6.0.0"
thiserror = "2.0.18"
self_update = { version = "0.44.0", default-features = false, features = [
    "reqwest",
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
] }
forgeconf = { git = "https://github.com/chikof/forgeconf.git", rev = "8e594ee68a615b0f1e22b4243ea696a89934557c" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dependencies.watcher]
version = "0.1.0"
path = "../watcher"
