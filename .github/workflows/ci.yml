name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo directories
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rocas

      - name: Install cargo-deny and typos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,typos-cli

      - name: Run the gate
        run: scripts/check.sh

      - name: Build the release binary
        run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo directories
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rocas-msrv

      - name: Check on MSRV
        run: cargo check --workspace --locked

  # Builds and lints the platform-specific code (Windows console, macOS paths).
  # Tests run on Linux only: the e2e tests isolate the config directory through
  # XDG_CONFIG_HOME, which macOS and Windows ignore.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo directories
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rocas-${{ matrix.os }}

      - name: Clippy with self-update
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy without self-update
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

      - name: Unit tests
        run: cargo test -p rocas --bins --locked

      - name: Build the release binary
        run: cargo build --release --locked
