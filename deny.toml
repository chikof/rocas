[graph]
all-features = true
no-default-features = false

[licenses]
confidence-threshold = 0.80

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# rocas and watcher are not published (release.toml: GitHub releases only).
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

